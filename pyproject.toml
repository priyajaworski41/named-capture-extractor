[project]
name = "named-capture-extractor"
version = "0.1.1"
description = "Runs a regex against text and returns a dictionary of named capture groups with their matches."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
